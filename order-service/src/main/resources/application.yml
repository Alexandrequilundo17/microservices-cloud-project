server:
  port: 8083

spring:
  application:
    name: order-service

  datasource:
    url: jdbc:h2:mem:orderdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Feign Client Configuration
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: basic

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
  info:
    title: Order Service API
    description: Microservice for order management with SQS and OpenFeign
    version: 1.0.0
    contact:
      name: Cloud Computing Course
      email: support@example.com

# Service URLs (for Feign clients)
services:
  user:
    url: ${SERVICES_USER_URL:http://localhost:8081}
  product:
    url: ${SERVICES_PRODUCT_URL:http://localhost:8082}

# AWS SQS configuration
cloud:
  sqs:
    order-created-publisher:
      enabled: false
      queue-url: "https://sqs.eu-central-1.amazonaws.com/263050932702/order-created"
      region: "eu-central-1"
    product-events-consumer:
      enabled: false
      queue-url: ""
      region: ""
      poll-interval-ms: 5000
      max-number-of-messages: 10
      wait-time-seconds: 20
