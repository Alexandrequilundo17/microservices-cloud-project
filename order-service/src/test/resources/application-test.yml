spring:
  application:
    name: order-service-test

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: false

services:
  user:
    url: http://localhost:8081
  product:
    url: http://localhost:8082

cloud:
  sqs:
    order-created-publisher:
      enabled: false
    product-events-consumer:
      enabled: false
