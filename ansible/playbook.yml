---
- name: Configurar EC2 e fazer deploy dos microservicos
  hosts: web_servers
  become: yes

  vars:
    app_dir: /home/ubuntu/app

  tasks:

    - name: Actualizar pacotes do sistema
      apt:
        update_cache: yes

    - name: Instalar dependencias do Docker
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
        state: present

    - name: Adicionar chave GPG do Docker
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Adicionar repositorio Docker
      apt_repository:
        repo: deb https://download.docker.com/linux/ubuntu focal stable
        state: present

    - name: Instalar Docker
      apt:
        name: docker-ce
        state: present

    - name: Arrancar e activar Docker
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Adicionar ubuntu ao grupo docker
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Instalar Docker Compose
      get_url:
        url: https://github.com/docker/compose/releases/download/v2.24.0/docker-compose-linux-x86_64
        dest: /usr/local/bin/docker-compose
        mode: '0755'

    - name: Criar pasta da aplicacao
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Copiar docker-compose.yml para a EC2
      copy:
        src: docker-compose.prod.yml
        dest: "{{ app_dir }}/docker-compose.yml"
        owner: ubuntu
        group: ubuntu
        mode: '0644'

    - name: Fazer docker login no DockerHub
      command: docker login -u alexq113 -p "{{ dockerhub_password }}"
      no_log: true

    - name: Arrancar os microservicos
      command: docker compose up -d
      args:
        chdir: "{{ app_dir }}"

    - name: Criar servico systemd para auto-start dos containers
      copy:
        dest: /etc/systemd/system/microservices.service
        content: |
          [Unit]
          Description=Microservices Docker Compose
          After=docker.service
          Requires=docker.service

          [Service]
          WorkingDirectory=/home/ubuntu/app
          ExecStart=/usr/local/bin/docker-compose up -d
          ExecStop=/usr/local/bin/docker-compose down
          RemainAfterExit=yes
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target

    - name: Activar servico microservices no boot
      systemd:
        name: microservices
        enabled: yes
        daemon_reload: yes
